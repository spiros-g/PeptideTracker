name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-build-cache

      - name: Release lint
        run: gradle lintRelease --stacktrace --no-build-cache

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace --no-build-cache

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PeptideTracker-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "PeptideTracker-${GITHUB_REF_NAME}.aab"
          sha256sum "PeptideTracker-${GITHUB_REF_NAME}.apk" "PeptideTracker-${GITHUB_REF_NAME}.aab" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             "PeptideTracker-${GITHUB_REF_NAME}.apk"             "PeptideTracker-${GITHUB_REF_NAME}.aab"             SHA256SUMS.txt             --title "Peptide Tracker $GITHUB_REF_NAME"             --generate-notes
