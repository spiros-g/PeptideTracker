name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Resolve release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          RELEASE_TAG="v$VERSION_NAME"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Validate signing material
        if: env.SHOULD_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Prepare and verify release keystore
        if: env.SHOULD_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Keystore decoded: $(wc -c < release.keystore) bytes"
          echo "Keystore SHA256: $(sha256sum release.keystore | awk '{print $1}')"

          if keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore open: OK"
          else
            echo "Keystore open: FAILED"
            exit 1
          fi

          OFFICIAL_SIGNING_CERT_SHA256="$(
            keytool -exportcert \
              -keystore release.keystore \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
              sha256sum |
              awk '{print $1}'
          )"
          if [[ ! "$OFFICIAL_SIGNING_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Official signing certificate SHA-256 could not be derived."
            exit 1
          fi
          echo "OFFICIAL_SIGNING_CERT_SHA256=$OFFICIAL_SIGNING_CERT_SHA256" >> "$GITHUB_ENV"
          echo "Official signing certificate fingerprint: OK"

          printf 'signing probe' > signing-probe.txt
          jar cf signing-probe-unsigned.jar signing-probe.txt
          echo "Signing probe JAR: OK"

          SELECTED_KEY_PASSWORD=""
          cp signing-probe-unsigned.jar signing-probe-key.jar
          if jarsigner -keystore release.keystore -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" signing-probe-key.jar "$KEY_ALIAS" >/dev/null 2>&1; then
            SELECTED_KEY_PASSWORD="$KEY_PASSWORD"
            echo "Private key unlock: ANDROID_KEY_PASSWORD"
          else
            cp signing-probe-unsigned.jar signing-probe-store.jar
            if jarsigner -keystore release.keystore -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" signing-probe-store.jar "$KEY_ALIAS" >/dev/null 2>&1; then
              SELECTED_KEY_PASSWORD="$STORE_PASSWORD"
              echo "Private key unlock: store password"
            else
              echo "Private key unlock: FAILED for both configured passwords"
              exit 1
            fi
          fi

          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$SELECTED_KEY_PASSWORD
          EOF
          echo "Signing properties: OK"

      - name: Unit tests
        if: env.SHOULD_RELEASE == 'true'
        run: gradle testDebugUnitTest --stacktrace --no-build-cache

      - name: Release lint
        if: env.SHOULD_RELEASE == 'true'
        run: gradle lintRelease -PofficialSigningCertSha256="$OFFICIAL_SIGNING_CERT_SHA256" --stacktrace --no-build-cache

      - name: Build signed release APK and AAB
        if: env.SHOULD_RELEASE == 'true'
        run: gradle assembleRelease bundleRelease -PofficialSigningCertSha256="$OFFICIAL_SIGNING_CERT_SHA256" --stacktrace --no-build-cache

      - name: Prepare release assets
        if: env.SHOULD_RELEASE == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PeptideTracker-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "PeptideTracker-${RELEASE_TAG}.aab"
          sha256sum "PeptideTracker-${RELEASE_TAG}.apk" "PeptideTracker-${RELEASE_TAG}.aab" > SHA256SUMS.txt

      - name: Upload signed APK artifact
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PeptideTracker-${{ env.RELEASE_TAG }}-signed
          path: |
            PeptideTracker-${{ env.RELEASE_TAG }}.apk
            PeptideTracker-${{ env.RELEASE_TAG }}.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG"             "PeptideTracker-${RELEASE_TAG}.apk"             "PeptideTracker-${RELEASE_TAG}.aab"             SHA256SUMS.txt             --target "$GITHUB_SHA"             --title "Peptide Tracker $RELEASE_TAG"             --generate-notes
