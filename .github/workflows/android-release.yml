name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Resolve release version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          RELEASE_TAG="v$VERSION_NAME"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $RELEASE_TAG"
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "3fa085332a7c94ee843c17afab98183636e504e68052a2745aec8c6dc518f922  release.keystore" | sha256sum -c -
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-build-cache

      - name: Release lint
        run: gradle lintRelease --stacktrace --no-build-cache

      - name: Build signed release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace --no-build-cache

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PeptideTracker-${RELEASE_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "PeptideTracker-${RELEASE_TAG}.aab"
          sha256sum "PeptideTracker-${RELEASE_TAG}.apk" "PeptideTracker-${RELEASE_TAG}.aab" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               "PeptideTracker-${RELEASE_TAG}.apk"               "PeptideTracker-${RELEASE_TAG}.aab"               SHA256SUMS.txt               --clobber
          else
            gh release create "$RELEASE_TAG"               "PeptideTracker-${RELEASE_TAG}.apk"               "PeptideTracker-${RELEASE_TAG}.aab"               SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Peptide Tracker $RELEASE_TAG"               --generate-notes
          fi
