name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-build-cache

      - name: Lint
        run: gradle lintDebug --stacktrace --no-build-cache

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-build-cache

      - name: Build release variant
        run: gradle assembleRelease --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PeptideTrackerGR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
